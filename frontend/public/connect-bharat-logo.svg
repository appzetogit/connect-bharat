<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Connect Bharat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A4A"/>
      <stop offset="1" stop-color="#071628"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19D3BF"/>
      <stop offset="1" stop-color="#00A896"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#teal)" stroke-width="18"/>
  <!-- C: an open ring, the "connect" half of the mark -->
  <path d="M260 137 A124 124 0 1 0 260 375" fill="none" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round"/>
  <!-- B: two stacked bowls in teal, interlocking with the C -->
  <path d="M262 152 H318 a52 52 0 0 1 0 104 H262 Z M262 256 H330 a52 52 0 0 1 0 104 H262 Z"
        fill="none" stroke="url(#teal)" stroke-width="44" stroke-linejoin="round"/>
  <!-- route dot: the ride -->
  <circle cx="176" cy="256" r="26" fill="url(#teal)"/>
</svg>
